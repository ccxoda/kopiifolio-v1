<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>carvonkopiifolio</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>

  <body>
    <div class="grid-bg"></div>
    <div class="titlebar">
      <div class="tb-title">carvonkopii.exe</div>
      <div class="tb-clock" id="tb-clock">00:00</div>
    </div>

    <div class="home-window">
      <div class="home-tb">
        <div class="home-tb-title">home</div>
      </div>
      <div class="home-content">
        <div class="home-content-name">hiya! i'm kopii</div>
        <div class="home-content-body">
          ui/ux · frontend dev <br />
          digital artist · game designer
          <!-- <br />welcome to my portfolio! this is a work in progress, so please
          be patient as i continue to update it. thank you for visiting! -->
        </div>
        <div class="about-btn" onclick="openPop('about')">About</div>
      </div>
    </div>

    <div class="kopii-png">
      <img src="assets/ko-png.png" alt="kopii" />
    </div>

    <div class="folders">
      <div class="folder" onclick="openPop('skillsTools')">
        <div class="folder-icon">
          <!-- <img src="assets/folder.png" alt="folder" /> -->
          <!-- <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            width="48"
            height="48"
          >
            <path fill="#7070b8" d="M10 4H2v16h20V6H12l-2-2z" />
          </svg> -->
          <div class="folder-tab"></div>
          <div class="folder-body"></div>
        </div>
        <div class="folder-name">skills & tools</div>
      </div>
      <div class="folder" onclick="openPop('codingProjects')">
        <div class="folder-icon">
          <div class="folder-tab"></div>
          <div class="folder-body"></div>
        </div>
        <div class="folder-name">coding projects</div>
      </div>
      <div class="folder" onclick="openPop('certifications')">
        <div class="folder-icon">
          <div class="folder-tab"></div>
          <div class="folder-body"></div>
        </div>
        <div class="folder-name">certifications</div>
      </div>
      <div class="folder" onclick="openPop('artworks')">
        <div class="folder-icon">
          <div class="folder-tab"></div>
          <div class="folder-body"></div>
        </div>
        <div class="folder-name">artworks</div>
      </div>
    </div>

    <div class="chat-bubble" onclick="openPop('message')">Send a message!</div>

    <div class="socials">
      <div class="soc-ico" title="Email">✉</div>
      <div class="soc-ico" title="LinkedIn">in</div>
      <div class="soc-ico" title="GitHub">GH</div>
      <div class="soc-ico" title="Facebook">f</div>
      <div class="soc-ico" title="Twitter/X">✕</div>
    </div>

    <div class="music-player">
      <div class="mp-titlebar">
        <div class="mp-title">music player</div>
        <div class="mp-close">[x]</div>
      </div>
      <div class="mp-body">
        <div class="mp-track" id="mp-song">♪ song name</div>
        <div class="mp-artist" id="mp-artist">- artist</div>
        <div class="mp-progress">
          <div class="mp-fill" id="mp-fill"></div>
        </div>
        <div class="mp-controls">
          <div class="mp-btn">⏮</div>
          <div class="mp-btn" id="mp-play">⏯</div>
          <div class="mp-btn">⏭</div>
        </div>
      </div>
    </div>
  </body>
</html>
